[tool.poetry]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор файлов: события из CSV и JSONL в статистический отчёт"
authors = ["Шангин Антон"]
readme = "README.md"
packages = [{ include = "streamstats", from = "src" }]


[tool.poetry.dependencies]
python = ">=3.13"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pre-commit = "^4.5.0"
black = "^25.11.0"
ruff = "^0.14.7"
mypy = "^1.19.0"


[tool.poetry.scripts]
streamstats = "streamstats.__main__:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.black]
line-length = 120
target-version = ['py313']


[tool.ruff]
fix = false
target-version = "py313"
line-length = 120
src = ["src"]


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120


[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
lines-between-types = 1
no-sections = false